services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: maritime
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-maritime_dev}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-maritime_dev}
      DB_NAME: maritime
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      PORT: 3000
      CORS_ORIGIN: http://localhost:3001
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./maritime-frontend
      args:
        REACT_APP_API_URL: http://localhost:3000
    ports: ["3001:80"]
    depends_on: [api]
volumes:
  mysql_data:
